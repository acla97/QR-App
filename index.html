<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reindirizzamento…</title>
<style>
  body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#555;background:#fafafa;text-align:center;padding:20px}
</style>
</head>
<body>
<p id="m">Reindirizzamento in corso…</p>
<script>
(async () => {
  const m = document.getElementById('m');
  try {
    const id = new URLSearchParams(location.search).get('d');
    if (!id) throw new Error('Dispositivo non specificato');
    const r = await fetch('config.json?t=' + Date.now(), { cache: 'no-store' });
    const cfg = await r.json();
    const dev = cfg.devices && cfg.devices[id];
    if (!dev || !/^https?:\/\//i.test(dev.url)) throw new Error('Link non trovato');
    location.replace(dev.url);
  } catch (e) {
    m.textContent = 'Link non disponibile al momento.';
  }
})();
</script>
</body>
</html>
