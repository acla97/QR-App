<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin redirect</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;padding:20px;color:#222}
  .card{max-width:480px;margin:0 auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{font-size:1.3rem;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:#666;font-size:.9rem}
  label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 4px}
  input{width:100%;padding:11px;border:1px solid #ccd;border-radius:8px;font-size:1rem}
  button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#1a73e8;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
  button.sec{background:#e8eaed;color:#222;margin-top:8px}
  button:disabled{opacity:.5}
  #st{margin-top:14px;font-size:.9rem;min-height:1.2em}
  .ok{color:#188038}.err{color:#d93025}
  details{margin-top:18px;font-size:.85rem;color:#555}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Link di destinazione</h1>
  <p class="sub">Cambia dove porta la targhetta NFC / QR.</p>

  <label for="url">URL attuale / nuovo URL</label>
  <input id="url" type="url" placeholder="https://..." inputmode="url" autocomplete="off">

  <label for="token">Token GitHub (salvato solo su questo dispositivo)</label>
  <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">

  <button id="save">Salva</button>
  <button id="test" class="sec">Prova il link</button>
  <div id="st"></div>

  <details>
    <summary>Impostazioni repository</summary>
    <div class="row">
      <div><label for="owner">Utente GitHub</label><input id="owner"></div>
      <div><label for="repo">Repository</label><input id="repo"></div>
    </div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const st = (msg, cls='') => { $('st').textContent = msg; $('st').className = cls; };

// Rileva utente/repo dall'indirizzo GitHub Pages (utente.github.io/repo/)
const host = location.hostname;
const parts = location.pathname.split('/').filter(Boolean);
let owner = '', repo = '';
if (host.endsWith('.github.io')) {
  owner = host.split('.')[0];
  repo = (parts[0] && !parts[0].endsWith('.html')) ? parts[0] : owner + '.github.io';
}
const ls = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

$('owner').value = ls('owner') || owner;
$('repo').value = ls('repo') || repo;
$('token').value = ls('token');

const api = () => `https://api.github.com/repos/${$('owner').value.trim()}/${$('repo').value.trim()}/contents/config.json`;
const headers = () => {
  const h = { 'Accept': 'application/vnd.github+json' };
  const t = $('token').value.trim();
  if (t) h['Authorization'] = 'Bearer ' + t;
  return h;
};
const dec = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ''))));
const enc = s => btoa(unescape(encodeURIComponent(s)));

async function load() {
  if (!$('owner').value || !$('repo').value) return;
  try {
    const r = await fetch(api() + '?t=' + Date.now(), { headers: headers(), cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    $('url').value = JSON.parse(dec(j.content)).url || '';
  } catch (e) {
    st('Impossibile leggere il link attuale (controlla utente/repo).', 'err');
  }
}

$('save').onclick = async () => {
  const url = $('url').value.trim();
  if (!/^https?:\/\//i.test(url)) return st('Inserisci un URL che inizi con http:// o https://', 'err');
  if (!$('token').value.trim()) return st('Inserisci il token GitHub.', 'err');
  $('save').disabled = true; st('Salvataggio…');
  try {
    const g = await fetch(api() + '?t=' + Date.now(), { headers: headers(), cache: 'no-store' });
    if (!g.ok) throw new Error('Lettura fallita (' + g.status + '). Token o repo errati?');
    const sha = (await g.json()).sha;
    const body = { message: 'Aggiorna URL di destinazione', content: enc(JSON.stringify({ url }, null, 2) + '\n'), sha };
    const p = await fetch(api(), { method: 'PUT', headers: { ...headers(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!p.ok) throw new Error('Scrittura fallita (' + p.status + '). Il token ha il permesso "Contents: Read and write"?');
    lset('token', $('token').value.trim()); lset('owner', $('owner').value.trim()); lset('repo', $('repo').value.trim());
    st('Salvato! Attivo entro circa 1 minuto.', 'ok');
  } catch (e) { st(e.message, 'err'); }
  $('save').disabled = false;
};

$('test').onclick = () => {
  const u = $('url').value.trim();
  if (/^https?:\/\//i.test(u)) window.open(u, '_blank'); else st('URL non valido.', 'err');
};

load();
</script>
</body>
</html>
